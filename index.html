<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chez Papounet 🥰</title>

  <!-- Métadonnées PWA & iOS Home Screen -->
  <meta name="application-name" content="Papounet 🥰">
  <meta name="apple-mobile-web-app-title" content="Papounet 🥰">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <!-- Icônes -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Polices Google Fonts (Roboto & Roboto Condensed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400&family=Roboto:wght@700&display=swap" rel="stylesheet">

  <!-- Feuilles de style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- En-tête fixe -->
  <header>
    <div class="header-title">
      <h1 class="title-line1">LES PETITS LOULOUS</h1>
      <span class="title-line2">chez Papounet 🥰</span>
    </div>
    <button class="today-btn" id="todayBtn" onclick="scrollToCurrentWeek()" title="Revenir à la date du jour">
      Auj.
    </button>
  </header>

  <!-- Conteneur principal de la timeline -->
  <main class="container" id="timeline">
    <div class="loader-container" id="loader">
      <div class="spinner"></div>
      <p>Synchronisation du planning...</p>
    </div>
  </main>

  <!-- Barre de recherche fixe en bas -->
  <nav class="bottom-bar" aria-label="Recherche par date">
    <input type="date" id="searchDate" aria-label="Choisir une date pour aller à la semaine">
    <button onclick="searchDate()" aria-label="Aller à la date sélectionnée">Go</button>
  </nav>

  <!-- Scripts modulaires -->
  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
