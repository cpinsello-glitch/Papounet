<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Papounet</title>

  <!-- Métadonnées PWA & iOS Home Screen -->
  <meta name="application-name" content="Papounet">
  <meta name="apple-mobile-web-app-title" content="Papounet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <!-- Icônes officielles (Photo de Papounet) -->
  <link rel="icon" type="image/png" sizes="256x256" href="icon.png?v=13">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=13">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=13">
  <link rel="manifest" href="manifest.webmanifest?v=13">

  <!-- Polices Google Fonts (Roboto & Roboto Condensed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400&family=Roboto:wght@700&display=swap" rel="stylesheet">

  <!-- Feuilles de style -->
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>

  <!-- Conteneur principal de la timeline -->
  <main class="container" id="timeline">
    <div class="loader-container" id="loader">
      <div class="spinner"></div>
      <p>Synchronisation du planning...</p>
    </div>
  </main>

  <!-- Barre de recherche fixe en bas -->
  <nav class="bottom-bar" aria-label="Recherche et navigation">
    <div class="bottom-bar-inner">
      <input type="date" id="searchDate" aria-label="Choisir une date pour aller à la semaine" placeholder="Choisir une date">
      <button id="searchBtn" onclick="searchDate()" aria-label="Aller à la date sélectionnée">Go</button>
      
      <!-- Bouton Bouclier Sécurisé pour Jours de Repos -->
      <button class="shield-btn" id="shieldBtn" onclick="onShieldClick()" title="Admin Access" aria-label="Admin Access">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </button>

      <button class="today-btn" id="todayBtn" onclick="scrollToCurrentWeek()" title="Revenir à la date du jour" aria-label="Revenir à aujourd'hui">
        <span class="sync-dot" id="syncDot"></span>
        <span id="todayText">Auj.</span>
      </button>
    </div>
    <div class="footer-credit">
      Fait avec ❤️ par Papounet pour mes petits loulous 🥰
    </div>
  </nav>

  <!-- Modale sécurisée pour le code PIN (Admin Access) -->
  <div id="pinModal" class="pin-modal-overlay" style="display: none;" onclick="onPinOverlayClick(event)">
    <div class="pin-modal-card" id="pinCard">
      <div class="pin-modal-icon">🛡️</div>
      <h2 class="pin-modal-title">Admin Access</h2>
      <p class="pin-modal-desc">Le code d'accès,<br>c'est que pour Papounet 😊</p>
      
      <div class="pin-input-container">
        <input type="password" id="pinInput" maxlength="5" pattern="[0-9]*" inputmode="numeric" placeholder="•••••" autocomplete="off" autofocus>
      </div>
      
      <div class="pin-error" id="pinError"></div>

      <div class="pin-modal-buttons">
        <button class="pin-btn-cancel" onclick="closePinModal()">Annuler</button>
        <button class="pin-btn-confirm" onclick="submitPin()">Valider</button>
      </div>
    </div>
  </div>

  <!-- Scripts modulaires avec cache-busting -->
  <script src="js/config.js?v=13"></script>
  <script src="js/engine.js?v=13"></script>
  <script src="js/api.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
