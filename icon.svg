<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26c6da" />
      <stop offset="100%" stop-color="#00838f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#004d40" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Fond squircle style iOS -->
  <rect width="512" height="512" rx="115" fill="url(#grad)" />
  
  <!-- Motif cœur / maison / enfants -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(0, -10)">
    <!-- Toit bienveillant / maison stylisée -->
    <path d="M256 120 L136 220 Q130 225 130 234 L130 360 Q130 380 150 380 L362 380 Q382 380 382 360 L382 234 Q382 225 376 220 Z" opacity="0.95"/>
    
    <!-- Coeur chaleureux au centre -->
    <path fill="#ff5252" d="M256 240 C246 222 220 216 206 232 C190 250 196 274 212 292 L256 332 L300 292 C316 274 322 250 306 232 C292 216 266 222 256 240 Z" />
  </g>

  <!-- Étoile / étincelle de bonheur -->
  <circle cx="340" cy="180" r="16" fill="#ffe082" />
</svg>

